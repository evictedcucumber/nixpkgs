name: Update

on:
  schedule:
    - cron: "0 23 * * *" # 01:00 SAST (UTC+2)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: |
          nix flake update
          git diff --quiet -- flake.lock || git commit -m "chore(flake): update inputs" -- flake.lock

      - name: Update packages
        run: |
          shopt -s nullglob
          # nix-update fails on flakes with Nix 2.35: https://github.com/Mic92/nix-update/issues/687
          nix_update=$(nix build --impure --no-link --print-out-paths --expr '
            let pkgs = (builtins.getFlake (toString ./.)).inputs.nixpkgs.legacyPackages.x86_64-linux;
            in pkgs.nix-update.override { nix = pkgs.nixVersions.nix_2_34; }')/bin/nix-update
          for dir in pkgs/*/; do
            pkg=$(basename "$dir")
            if ! "$nix_update" --flake "$pkg"; then
              echo "::warning::Failed to update $pkg"
              git checkout -- "$dir"
              continue
            fi
            if ! git diff --quiet -- "$dir"; then
              version=$(nix eval --raw ".#$pkg.version")
              git commit -m "chore($pkg): update to $version" -- "$dir"
            fi
          done

      - name: Update Rust manifests
        run: |
          added=$(nix shell --inputs-from . nixpkgs#curl nixpkgs#jq -c rust/update.sh)
          if [ -n "$added" ]; then
            git commit -m "chore(rust): add ${added//$'\n'/, } manifests" -- rust/manifests.json
          fi

      - name: Check
        run: nix flake check -L

      - name: Push
        run: git push
