name: Update

on:
  schedule:
    - cron: "0 23 * * *" # 01:00 SAST (UTC+2)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: |
          nix flake update
          git diff --quiet -- flake.lock || git commit -m "chore(flake): update inputs" -- flake.lock

      - name: Update packages
        run: |
          shopt -s nullglob
          for dir in pkgs/*/; do
            pkg=$(basename "$dir")
            if ! nix run --inputs-from . nixpkgs#nix-update -- --flake "$pkg"; then
              echo "::warning::Failed to update $pkg"
              git checkout -- "$dir"
              continue
            fi
            if ! git diff --quiet -- "$dir"; then
              version=$(nix eval --raw ".#$pkg.version")
              git commit -m "chore($pkg): update to $version" -- "$dir"
            fi
          done

      - name: Check
        run: nix flake check -L

      - name: Push
        run: git push
